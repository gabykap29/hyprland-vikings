# Omarchy Quattro surfaces for Assassin's Creed Valhalla (Raven Clan).
# Deep Nordic fjord slate, Aurora Teal & Animus Gold framing, and weathered bone typography.

[bar]
background = "#0D1318"
background-alpha = 0.88
text = "#E8DFC8"
active = "#D49B4B"
scale-with-font = true
size-horizontal = 30
size-vertical = 30

[hyprland]
active-border = "rgba(4ecdc4ee) rgba(38b2a6ee) rgba(d49b4bee) rgba(e5a93cee) 45deg"
active-border-foreground = "#0D1318"

[controls]
normal-color = "#E8DFC8"
normal-fill-alpha = 0.05
normal-border = "#38B2A6"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color = "#4ECDC4"
hover-cursor-fill-alpha = 0.14
hover-cursor-border = "#D49B4B"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.65

focus-color = "#D49B4B"
focus-fill-alpha = 0.16
focus-border = "#D49B4B"
focus-border-width = 1
focus-border-alpha = 0.85

selected-color = "#D49B4B"
selected-fill-alpha = 0.22
selected-border = "#4ECDC4"
selected-border-width = 1
selected-border-alpha = 0.75

pressed-color = "#38B2A6"
pressed-fill-alpha = 0.28
selection-color = "#D49B4B"
selection-fill-alpha = 0.38

[spacing]
scale = 1.0
scale-with-font = true
xs = 2
md = 4
control-padding-y = 5
panel-padding = 12

[font]
base-size = 13
heading = 16
icon-large = 18

[popups]
background = "#0D1318"
background-alpha = 0.94
text = "#E8DFC8"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 2

[tooltip]
background = "#131C24"
background-alpha = 0.96
text = "#E8DFC8"
border = "#D49B4B"
border-alpha = 0.85
border-width = 1

[notifications]
background = "#0D1318"
background-alpha = 0.94
text = "#E8DFC8"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 2
countdown = "#D49B4B"

[launcher]
background = "#0D1318"
background-alpha = 0.94
text = "#E8DFC8"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 2
scrim = "#06090C"
scrim-alpha = 0.55
selected-background = "#D49B4B"
selected-background-alpha = 0.22
selected-text = "#F7F1E1"
selected-border = "#4ECDC4"
selected-border-alpha = 0.85
selected-border-width = 1

[menu]
background = "#0D1318"
background-alpha = 0.94
text = "#E8DFC8"
border = "hyprland.active-border"
border-alpha = 1.0
border-width = 2
scrim = "#06090C"
scrim-alpha = 0.50
selected-background = "#D49B4B"
selected-background-alpha = 0.22
selected-text = "#F7F1E1"
selected-border = "#4ECDC4"
selected-border-alpha = 0.85
selected-border-width = 1

[polkit]
background = "#0D1318"
background-alpha = 0.95
text = "#E8DFC8"
text-error = "#C94A4A"
border = "hyprland.active-border"
border-error = "#C94A4A"
border-alpha = 1.0
border-width = 2
scrim = "#06090C"
scrim-alpha = 0.60
accent = "#D49B4B"

[lock]
background = "#0D1318"
background-alpha = 0.86
text = "#F0BA65"
placeholder = "#E8DFC899"
text-error = "#E06666"
border = "hyprland.active-border"
border-active = "hyprland.active-border"
border-error = "#C94A4A"
border-alpha = 1.0
border-width = 2
selection = "#38B2A6"
selection-alpha = 0.45

[image-picker]
scrim = "#06090C"
scrim-alpha = 0.60
text = "#E8DFC8"
selected-border = "#D49B4B"
selected-border-alpha = 1.0
unselected-border = "#25313A"
unselected-border-alpha = 0.72
